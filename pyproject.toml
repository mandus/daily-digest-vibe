[project]
name = "daily-digest-vibe"
version = "0.1.0"
description = "A personalized Hacker News daily digest that learns your preferences and presents the most relevant stories in grouped topics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Åsmund Ødegård", email = "asmund@odegard.com"}
]

dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.3.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "typing-extensions>=4.8.0",
]

[project.scripts]
daily-digest = "daily_digest.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daily_digest", "web"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = "tests/*"
testpaths = ["tests"]
